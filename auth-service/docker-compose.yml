services:
  postgres:
    image: postgres:16-alpine
    container_name: equipmap-auth-postgres
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: auth_service
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service -d auth_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    container_name: equipmap-auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_service
      SPRING_DATASOURCE_USERNAME: auth_service
      SPRING_DATASOURCE_PASSWORD: auth_service
      AUTH_JWT_SECRET: change-me-change-me-change-me-change-me-change-me
      AUTH_SEED_ADMIN_EMAIL: admin@equipmap.local
      AUTH_SEED_ADMIN_PASSWORD: admin123
    ports:
      - "8081:8081"

volumes:
  auth_postgres_data:
