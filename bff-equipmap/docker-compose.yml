services:
  bff-equipmap:
    build: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      GRAPHQL_PATH: /graphql
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: dev-only-change-me-dev-only-change-me-dev-only-change-me
      JWT_ISSUER: equipmap-auth-service
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_BY_IP: 120
      RATE_LIMIT_MAX_BY_USER: 240
      AUTH_SERVICE_URL: http://host.docker.internal:8081
      CONDOMINIUM_SERVICE_URL: http://host.docker.internal:8082
      EQUIPMENT_SERVICE_URL: http://host.docker.internal:8083
      MAINTENANCE_SERVICE_URL: http://host.docker.internal:8084
      WARRANTY_SERVICE_URL: http://host.docker.internal:8085
      PARKING_SERVICE_URL: http://host.docker.internal:8086
      BRIGADIER_SERVICE_URL: http://host.docker.internal:8087
      NOTIFICATION_SERVICE_URL: http://host.docker.internal:8088
