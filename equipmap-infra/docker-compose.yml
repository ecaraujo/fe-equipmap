services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-equipmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equipmap}
      POSTGRES_MULTIPLE_DATABASES: auth_service,condominium_service,equipment_service,maintenance_service,warranty_service,parking_service,brigadier_service,notification_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equipmap}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-equipmap}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-equipmap}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-equipmap}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-equipmap123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-equipmap} ${MINIO_ROOT_PASSWORD:-equipmap123}; do sleep 2; done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-equipmap-warranty-documents};
      exit 0;
      "

  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_service
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-equipmap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-equipmap}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-equipmap-auth-service}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-change-me-dev-only-change-me-dev-only-change-me}
      AUTH_SEED_ADMIN_EMAIL: ${AUTH_SEED_ADMIN_EMAIL:-admin@equipmap.local}
      AUTH_SEED_ADMIN_PASSWORD: ${AUTH_SEED_ADMIN_PASSWORD:-admin123}
      AUTH_SEED_CONDOMINIUM_ID: ${AUTH_SEED_CONDOMINIUM_ID:-11111111-1111-1111-1111-111111111111}
      AUTH_SEED_CONDOMINIUM_NAME: ${AUTH_SEED_CONDOMINIUM_NAME:-Residencial Park EquipMap}
      AUTH_SEED_CONDOMINIUM_CNPJ: ${AUTH_SEED_CONDOMINIUM_CNPJ:-12345678000199}
      AUTH_SEED_CONDOMINIUM_ADDRESS: ${AUTH_SEED_CONDOMINIUM_ADDRESS:-Rua das Acacias, 100}
      AUTH_SEED_CONDOMINIUM_TIMEZONE: ${AUTH_SEED_CONDOMINIUM_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  condominium-service:
    build:
      context: ..
      dockerfile: condominium-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/condominium_service
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-equipmap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-equipmap}
      CONDOMINIUM_SEED_ID: ${AUTH_SEED_CONDOMINIUM_ID:-11111111-1111-1111-1111-111111111111}
      CONDOMINIUM_SEED_NAME: ${AUTH_SEED_CONDOMINIUM_NAME:-Residencial Park EquipMap}
      CONDOMINIUM_SEED_CNPJ: ${AUTH_SEED_CONDOMINIUM_CNPJ:-12345678000199}
      CONDOMINIUM_SEED_ADDRESS: ${AUTH_SEED_CONDOMINIUM_ADDRESS:-Rua das Acacias, 100}
      CONDOMINIUM_SEED_TIMEZONE: ${AUTH_SEED_CONDOMINIUM_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  equipment-service:
    build:
      context: ..
      dockerfile: equipment-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/equipment_service
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-equipmap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-equipmap}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-equipmap}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-equipmap}
      OUTBOX_POLLING_DELAY_MS: ${OUTBOX_POLLING_DELAY_MS:-5000}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  maintenance-service:
    build:
      context: ..
      dockerfile: maintenance-service/Dockerfile
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/maintenance_service
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-equipmap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-equipmap}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-equipmap}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-equipmap}
      OUTBOX_POLLING_DELAY_MS: ${OUTBOX_POLLING_DELAY_MS:-5000}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  warranty-service:
    build:
      context: ..
      dockerfile: warranty-service/Dockerfile
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/warranty_service
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-equipmap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-equipmap}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-equipmap}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-equipmap}
      EQUIPMAP_STORAGE_ENDPOINT: http://minio:9000
      EQUIPMAP_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      EQUIPMAP_STORAGE_BUCKET: ${MINIO_BUCKET:-equipmap-warranty-documents}
      EQUIPMAP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-equipmap}
      EQUIPMAP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-equipmap123}
      WARRANTY_EXPIRING_WINDOW_DAYS: ${WARRANTY_EXPIRING_WINDOW_DAYS:-30}
      OUTBOX_POLLING_DELAY_MS: ${OUTBOX_POLLING_DELAY_MS:-5000}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  parking-service:
    build:
      context: ..
      dockerfile: parking-service/Dockerfile
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parking_service
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-equipmap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-equipmap}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

  brigadier-service:
    build:
      context: ..
      dockerfile: brigadier-service/Dockerfile
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brigadier_service
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-equipmap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-equipmap}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-equipmap}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-equipmap}
      EQUIPMAP_MESSAGING_PROVIDER: ${EQUIPMAP_MESSAGING_PROVIDER:-sandbox}
      BRIGADIER_CERTIFICATION_EXPIRING_WINDOW_DAYS: ${BRIGADIER_CERTIFICATION_EXPIRING_WINDOW_DAYS:-90}
      BRIGADIER_MAX_RETRY_ATTEMPTS: ${BRIGADIER_MAX_RETRY_ATTEMPTS:-3}
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_service
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-equipmap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-equipmap}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-equipmap}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-equipmap}
      NOTIFICATION_DEFAULT_USER_ID: ${NOTIFICATION_DEFAULT_USER_ID:-00000000-0000-0000-0000-000000000001}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  bff-equipmap:
    build:
      context: ../bff-equipmap
    environment:
      NODE_ENV: development
      PORT: 4000
      GRAPHQL_PATH: /graphql
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-change-me-dev-only-change-me-dev-only-change-me}
      JWT_ISSUER: ${AUTH_JWT_ISSUER:-equipmap-auth-service}
      AUTH_SERVICE_URL: http://auth-service:8081
      CONDOMINIUM_SERVICE_URL: http://condominium-service:8082
      EQUIPMENT_SERVICE_URL: http://equipment-service:8083
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8084
      WARRANTY_SERVICE_URL: http://warranty-service:8085
      PARKING_SERVICE_URL: http://parking-service:8086
      BRIGADIER_SERVICE_URL: http://brigadier-service:8087
      NOTIFICATION_SERVICE_URL: http://notification-service:8088
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_started
      condominium-service:
        condition: service_started
      equipment-service:
        condition: service_started
      maintenance-service:
        condition: service_started
      warranty-service:
        condition: service_started
      parking-service:
        condition: service_started
      brigadier-service:
        condition: service_started
      notification-service:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/graphql}
    ports:
      - "5173:5173"
    depends_on:
      bff-equipmap:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
