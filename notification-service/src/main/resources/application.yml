server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/notification_service}
    username: ${SPRING_DATASOURCE_USERNAME:notification_service}
    password: ${SPRING_DATASOURCE_PASSWORD:notification_service}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5677}
    username: ${SPRING_RABBITMQ_USERNAME:notification_service}
    password: ${SPRING_RABBITMQ_PASSWORD:notification_service}
    listener:
      simple:
        acknowledge-mode: manual

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

equipmap:
  notification:
    default-user-id: ${NOTIFICATION_DEFAULT_USER_ID:00000000-0000-0000-0000-000000000001}
