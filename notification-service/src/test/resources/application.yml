spring:
  datasource:
    url: jdbc:h2:mem:notification_service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

equipmap:
  notification:
    default-user-id: 00000000-0000-0000-0000-000000000001
