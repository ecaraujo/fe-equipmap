query Me {
  me {
    id
    name
    email
    role
    avatar
    condominiumId
    condominiumName
    condominiums {
      id
      name
      cnpj
      address
      timezone
      active
    }
  }
}

query DashboardSummary {
  dashboardSummary {
    generatedAt
    condominiumId
    condominiumName
    equipmentTotal
    maintenancePendingTotal
    maintenanceOverdueTotal
    warrantyExpiringTotal
    unreadNotificationsTotal
    recentEquipment {
      id
      name
      type
      typeLabel
      location
      status
      statusLabel
      nextMaintenance
      patrimonyCode
    }
    upcomingMaintenances {
      id
      equipment
      equipmentId
      type
      typeLabel
      status
      statusLabel
      scheduledDate
      description
    }
    maintenanceChart {
      month
      label
      completed
      pending
    }
  }
}

mutation Login($input: LoginInput!) {
  login(input: $input) {
    token
    refreshToken
    requiresCondominiumSelection
    user {
      id
      name
      email
      role
      avatar
      condominiumId
      condominiumName
      condominiums {
        id
        name
        cnpj
        address
        timezone
        active
      }
    }
  }
}

mutation Refresh {
  refresh {
    token
    refreshToken
    requiresCondominiumSelection
    user {
      id
      name
      email
      role
      avatar
      condominiumId
      condominiumName
      condominiums {
        id
        name
        cnpj
        address
        timezone
        active
      }
    }
  }
}

mutation Logout {
  logout
}

mutation SwitchCondominium($condominiumId: ID!) {
  switchCondominium(condominiumId: $condominiumId) {
    token
    refreshToken
    requiresCondominiumSelection
    user {
      id
      name
      email
      role
      avatar
      condominiumId
      condominiumName
      condominiums {
        id
        name
        cnpj
        address
        timezone
        active
      }
    }
  }
}

query Equipments($filters: EquipmentFilters, $pagination: PaginationInput) {
  equipments(filters: $filters, pagination: $pagination) {
    pageInfo {
      total
      page
      pageSize
      totalPages
    }
    data {
      id
      name
      type
      typeLabel
      brand
      model
      serialNumber
      patrimonyCode
      location
      status
      statusLabel
      acquisitionDate
      warrantyExpiry
      lastMaintenance
      nextMaintenance
      value
      createdAt
      updatedAt
      createdBy
    }
  }
}

mutation CreateEquipment($input: CreateEquipmentInput!) {
  createEquipment(input: $input) {
    id
    name
    type
    typeLabel
    brand
    model
    serialNumber
    patrimonyCode
    location
    status
    statusLabel
    acquisitionDate
    warrantyExpiry
    lastMaintenance
    nextMaintenance
    value
    createdAt
    updatedAt
    createdBy
  }
}

mutation UpdateEquipment($id: ID!, $input: UpdateEquipmentInput!) {
