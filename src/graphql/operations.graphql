query ParkingData {
  parkingApartments {
    id
    unit
    block
    ownerName
    phone
    email
    floor
    hasVehicle
    createdAt
    updatedAt
    createdBy
  }
  parkingSpots {
    id
    number
    type
    typeLabel
    covered
    floor
    assignedTo
    createdAt
    updatedAt
    createdBy
  }
  parkingResults {
    id
    apartmentId
    spotId
    unit
    block
    ownerName
    spotNumber
    spotType
    spotTypeLabel
    seed
    drawnAt
    createdAt
    updatedAt
    createdBy
  }
  lotterySessions {
    id
    seed
    drawnAt
    undrawnApartments {
      id
      unit
      block
      ownerName
    }
    results {
      id
    }
  }
}

