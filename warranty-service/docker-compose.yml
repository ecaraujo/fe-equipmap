services:
  postgres:
    image: postgres:16-alpine
    container_name: equipmap-warranty-postgres
    environment:
      POSTGRES_DB: warranty_service
      POSTGRES_USER: warranty_service
      POSTGRES_PASSWORD: warranty_service
    ports:
      - "5437:5432"
    volumes:
      - warranty_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warranty_service -d warranty_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: equipmap-warranty-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: warranty_service
      RABBITMQ_DEFAULT_PASS: warranty_service
    ports:
      - "5675:5672"
      - "15675:15672"
    volumes:
      - warranty_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: equipmap-warranty-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: warranty_service
      MINIO_ROOT_PASSWORD: warranty_service
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - warranty_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  warranty-service:
    build:
      context: ..
      dockerfile: warranty-service/Dockerfile
    container_name: equipmap-warranty-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/warranty_service
      SPRING_DATASOURCE_USERNAME: warranty_service
      SPRING_DATASOURCE_PASSWORD: warranty_service
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: warranty_service
      SPRING_RABBITMQ_PASSWORD: warranty_service
      EQUIPMAP_STORAGE_ENDPOINT: http://minio:9000
      EQUIPMAP_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      EQUIPMAP_STORAGE_BUCKET: equipmap-warranty-documents
      EQUIPMAP_STORAGE_ACCESS_KEY: warranty_service
      EQUIPMAP_STORAGE_SECRET_KEY: warranty_service
    ports:
      - "8085:8085"

volumes:
  warranty_postgres_data:
  warranty_rabbitmq_data:
  warranty_minio_data:
