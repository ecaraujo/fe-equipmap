spring:
  datasource:
    url: jdbc:h2:mem:warranty_service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

equipmap:
  outbox:
    polling-delay-ms: 600000
  storage:
    endpoint: http://localhost:9000
    public-endpoint: http://localhost:9000
    bucket: equipmap-warranty-documents
    access-key: test
    secret-key: test
    presigned-expiration-minutes: 15
